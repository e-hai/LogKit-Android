plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    id 'maven-publish'
}

android {
    namespace 'com.kit.log'
    compileSdk Integer.parseInt(libs.versions.compileSdk.get())

    defaultConfig {
        minSdk Integer.parseInt(libs.versions.minSdk.get())

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // 1. 坐标三要素动态化 (支持命令行/CI/JitPack覆盖，具备稳妥默认值)
                groupId = project.findProperty('PROJ_GROUP') ?: project.findProperty('groupId') ?: 'com.github.e-hai'
                artifactId = project.findProperty('PROJ_ARTIFACT_ID') ?: project.findProperty('artifactId') ?: 'LogKit-Android'
                version = (project.hasProperty('version') && project.property('version') != 'unspecified') ?
                          project.property('version') : (project.findProperty('PROJ_VERSION') ?: '1.0.1')

                pom {
                    name = 'LogKit Android'
                    description = 'Pure Kotlin, Jetpack Compose Foundation logger for Android'
                    url = 'https://github.com/e-hai/LogKit-Android'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }

        // 2. 自定义远程 Maven 仓库动态挂载 (支持 Nexus / Artifactory / 阿里云等)
        repositories {
            def repoUrl = project.findProperty('MAVEN_REPO_URL') ?: System.getenv('MAVEN_REPO_URL')
            if (repoUrl) {
                maven {
                    name = "customMaven"
                    url = uri(repoUrl)
                    def user = project.findProperty('MAVEN_REPO_USERNAME') ?: System.getenv('MAVEN_REPO_USERNAME')
                    def pwd = project.findProperty('MAVEN_REPO_PASSWORD') ?: System.getenv('MAVEN_REPO_PASSWORD')
                    if (user && pwd) {
                        credentials {
                            username = user
                            password = pwd
                        }
                    }
                }
            }
        }
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // Jetpack Compose (100% Pure Foundation & UI, Zero Material3, Zero Material)
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.material.icons.core
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    testImplementation libs.junit
    testImplementation libs.json
    androidTestImplementation libs.androidx.ext.junit
    androidTestImplementation libs.espresso.core

}
